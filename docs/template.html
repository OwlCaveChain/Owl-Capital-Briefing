<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owl Capital 아침 브리핑 · {{DATE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root{
    --ink:#1F2A44; --sub:#56617A; --bg:#EEF1F4; --paper:#FFFFFF; --line:#D5DBE3;
    --fear:#B4442F; --greed:#2F7D55; --amber:#C98A1B;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#E6EAF2; --sub:#A3ADBF; --bg:#141A26; --paper:#1D2433; --line:#2E3747; }
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:18px/1.7 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
  header{margin-bottom:28px}
  h1{font:700 30px/1.3 "Gowun Batang",serif;margin:0}
  .date{color:var(--sub);margin-top:4px}
  section{background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:22px 20px;margin-bottom:18px}
  h2{font:700 21px/1.4 "Gowun Batang",serif;margin:0 0 12px}
  /* 공포·탐욕 지수: 페이지의 중심 요소 */
  .fg-num{font:700 64px/1 "Gowun Batang",serif}
  .fg-label{font-size:20px;font-weight:700;margin-left:8px}
  .scale{position:relative;height:14px;border-radius:7px;margin:18px 0 6px;
    background:linear-gradient(90deg,var(--fear),var(--amber) 50%,var(--greed))}
  .needle{position:absolute;top:-6px;width:4px;height:26px;background:var(--ink);
    border-radius:2px;transform:translateX(-2px)}
  .ends{display:flex;justify-content:space-between;color:var(--sub);font-size:15px}
  .note{color:var(--sub);font-size:16px;margin:12px 0 0}
  img{max-width:100%;height:auto;display:block;border-radius:8px}
  ul{margin:0;padding-left:1.1em}
  li{margin-bottom:12px}
  a{color:var(--ink);text-underline-offset:3px}
  .who{color:var(--sub);font-size:15px}
  footer{color:var(--sub);font-size:15px;text-align:center;margin-top:28px}
  footer a{color:var(--sub)}
</style>
</head>
<body>
<main>
  <header>
    <h1>🦉 Owl Capital 아침 브리핑</h1>
    <div class="date">{{DATE}} 오전 6시 기준</div>
  </header>

  <section>
    <h2>시장 심리 (공포·탐욕 지수)</h2>
    <div><span class="fg-num">{{FG_VALUE}}</span><span class="fg-label">{{FG_LABEL_KO}}</span></div>
    <div class="scale"><div class="needle" style="left:{{FG_VALUE}}%"></div></div>
    <div class="ends"><span>극단적 공포 0</span><span>100 극단적 탐욕</span></div>
    <p class="note">{{FG_COMMENT}}</p>
  </section>

  <section>
    <h2>미국 휘발유 소매가격</h2>
    <img src="{{GAS_CHART_PATH}}" alt="미국 휘발유 소매가격 추이 차트">
    <p class="note">{{GAS_COMMENT}}</p>
  </section>

  <section>
    <h2>구독 블로그 새 글</h2>
    <ul>
      <!-- 글마다 반복 -->
      <li><a href="{{POST_URL}}">{{POST_TITLE}}</a><br>
        <span class="who">{{BLOGGER}}</span> — {{ONE_LINE_SUMMARY}}</li>
    </ul>
  </section>

  <footer>매일 오전 6시 자동 갱신 · <a href="archive.html">지난 브리핑 보기</a></footer>
</main>
</body>
</html>
